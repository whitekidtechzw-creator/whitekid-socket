name: Unzip
on: workflow_dispatch
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip into repo root
        run: |
          unzip -o whitekid-socket.zip
          cp -r whitekid-sockets/. .
          rm -rf whitekid-sockets whitekid-socket.zip
      - name: Commit
        run: |
          git config user.name "whitekid"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Whitekid Sockets"
          git push
